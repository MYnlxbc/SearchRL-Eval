version: 1
baseline: B2.1
description: Two-round retrieval with duplicate-query stopping and document deduplication

model:
  backend: transformers
  path_env: MODEL_PATH
  dtype: bfloat16
  attention: sdpa

retrieval:
  enabled: true
  url_env: RETRIEVER_URL
  topk: 3
  max_rounds: 2
  return_scores: true
  query_strategy: model_generated_followup
  followup_similarity_threshold: 0.85
  deduplicate_documents: true
  second_round_candidate_multiplier: 2

generation:
  max_new_tokens: 64
  query_max_new_tokens: 32
  do_sample: false
  num_beams: 1
  seed: 42

runtime:
  timeout_seconds_per_example: 600
  save_every_example: true
