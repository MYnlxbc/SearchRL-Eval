version: 1
baseline: B0
description: Direct generation without retrieval

model:
  backend: transformers
  path_env: MODEL_PATH
  dtype: bfloat16
  attention: sdpa

retrieval:
  enabled: false
  topk: 0
  max_rounds: 0

generation:
  max_new_tokens: 64
  do_sample: false
  num_beams: 1
  seed: 42

runtime:
  timeout_seconds_per_example: 300
  save_every_example: true
