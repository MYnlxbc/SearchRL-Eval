version: 1
baseline: B1
description: One retrieval round followed by generation

model:
  backend: transformers
  path_env: MODEL_PATH
  dtype: bfloat16
  attention: sdpa

retrieval:
  enabled: true
  url_env: RETRIEVER_URL
  topk: 3
  max_rounds: 1
  return_scores: true
  query_strategy: original_question

generation:
  max_new_tokens: 64
  do_sample: false
  num_beams: 1
  seed: 42

runtime:
  timeout_seconds_per_example: 300
  save_every_example: true
